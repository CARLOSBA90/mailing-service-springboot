version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mail-service-postgres
    environment:
      POSTGRES_DB: mailservice
      POSTGRES_USER: mailuser
      POSTGRES_PASSWORD: mailpass123
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U mailuser -d mailservice" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mail-network

  # Mail Service Application (para producción)
  mail-service:
    build: .
    container_name: mail-service-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/mailservice
      - SPRING_DATASOURCE_USERNAME=mailuser
      - SPRING_DATASOURCE_PASSWORD=mailpass123
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_AUTH=${SPRING_MAIL_AUTH:-true}
      - SPRING_MAIL_STARTTLS=${SPRING_MAIL_STARTTLS:-true}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - API_KEY=${API_KEY}
    ports:
      - "8081:8081"
    networks:
      - mail-network
    profiles:
      - production # Solo se levanta con: docker-compose --profile production up

volumes:
  postgres-data:
    driver: local

networks:
  mail-network:
    driver: bridge
