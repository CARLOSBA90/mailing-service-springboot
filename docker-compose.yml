# docker compose --profile production up -d
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: mail-service-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - /opt/docker/mail-service/postgres-data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapa la interpolación de Docker Compose → el shell del contenedor resuelve la variable
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mail-network

  # Mail Service Application  
  mail-service:
    build: .
    container_name: mail-service-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE}
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_MAIL_HOST=${SPRING_MAIL_HOST}
      - SPRING_MAIL_PORT=${SPRING_MAIL_PORT}
      - SPRING_MAIL_USERNAME=${SPRING_MAIL_USERNAME}
      - SPRING_MAIL_PASSWORD=${SPRING_MAIL_PASSWORD}
      - SPRING_MAIL_AUTH=${SPRING_MAIL_AUTH}
      - SPRING_MAIL_STARTTLS=${SPRING_MAIL_STARTTLS}
      - MAIL_FROM=${MAIL_FROM}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME}
      - API_KEY=${API_KEY}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - PURGE_CRON=${PURGE_CRON}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_DDL_AUTO:-validate}
    ports:
      - "${APP_PORT}:8020"
    networks:
      - mail-network
    profiles:
      - production # Solo se levanta con: docker-compose --profile production up

# Sin named volumes: se usan bind mounts para acceso físico directo al host

networks:
  mail-network:
    driver: bridge
