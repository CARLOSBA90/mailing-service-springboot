<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Mail Service - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .login-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .login-card {
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 32px;
            width: 100%;
            max-width: 360px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 24px;
        }

        .login-header .brand-icon {
            font-size: 2rem;
            display: block;
            margin-bottom: 8px;
        }

        .login-header h1 {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text);
        }

        .login-header p {
            font-size: 0.8rem;
            color: var(--text2);
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text2);
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 0.85rem;
            font-family: inherit;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            border-color: var(--blue);
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: none;
            background: var(--blue);
            color: #fff;
            font-size: 0.85rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: 8px;
        }

        .login-btn:hover {
            opacity: 0.85;
        }

        .login-alert {
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            margin-bottom: 16px;
            text-align: center;
        }

        .login-alert-error {
            background: rgba(248, 113, 113, 0.1);
            color: var(--red);
            border: 1px solid rgba(248, 113, 113, 0.15);
        }

        .login-alert-success {
            background: rgba(52, 211, 153, 0.1);
            color: var(--green);
            border: 1px solid rgba(52, 211, 153, 0.15);
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-header">
                <span class="brand-icon">📬</span>
                <h1>Mail Service</h1>
                <p>Acceso al panel de administración</p>
            </div>

            <div class="login-alert login-alert-error" th:if="${param.error}">
                Usuario o contraseña incorrectos
            </div>
            <div class="login-alert login-alert-success" th:if="${param.logout}">
                Sesión cerrada correctamente
            </div>

            <form th:action="@{/admin/login}" method="post">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" name="username" autocomplete="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="login-btn">Iniciar Sesión</button>
            </form>
        </div>
    </div>

</body>

</html>
