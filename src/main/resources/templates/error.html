<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="'Mail Service - ' + (${error} ?: 'Error')">Mail Service - Error</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <style>
        .error-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .error-card {
            text-align: center;
            max-width: 400px;
        }

        .error-code {
            font-size: 6rem;
            font-weight: 700;
            line-height: 1;
            background: linear-gradient(135deg, #4f8cff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 12px;
            letter-spacing: -2px;
        }

        .error-title {
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .error-desc {
            font-size: 0.85rem;
            color: var(--text2);
            line-height: 1.5;
            margin-bottom: 28px;
        }

        .error-home {
            display: inline-block;
            padding: 10px 24px;
            border-radius: 8px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 0.8rem;
            font-weight: 500;
            text-decoration: none;
            font-family: inherit;
        }

        .error-home:hover {
            border-color: #4f8cff;
            color: #4f8cff;
        }
    </style>
</head>

<body>

    <div class="error-wrapper">
        <div class="error-card">
            <div class="error-code" th:text="${status}">404</div>
            <h1 class="error-title" th:text="${error}">Página No Encontrada</h1>
            <p class="error-desc" th:text="${message}">La página que buscas no existe o fue movida.</p>
            <a href="/admin" class="error-home">← Volver al Dashboard</a>
        </div>
    </div>

</body>

</html>
