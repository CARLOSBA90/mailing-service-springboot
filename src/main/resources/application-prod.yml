 
spring:
  mail:
    host: ${SPRING_MAIL_HOST}
    port: ${SPRING_MAIL_PORT}
    username: ${SPRING_MAIL_USERNAME}
    password: ${SPRING_MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_AUTH}
          starttls:
            enable: ${SPRING_MAIL_STARTTLS}
 
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  # JPA en prod 
  jpa:
    hibernate:
      ddl-auto: validate  # No modifica el schema en prod 
    show-sql: false       # No mostrar SQL en prod 

mail-service:
  api-key: ${API_KEY}
  from:
    address: ${MAIL_FROM}
    name: ${MAIL_FROM_NAME}
  maintenance:
    purge-cron: ${PURGE_CRON}

# Admin UI credentials
admin:
  username: ${ADMIN_USERNAME}
  password: ${ADMIN_PASSWORD}
